name: Infrastructure (Terragrunt)

on:
  pull_request:
    paths:
      - "terraform/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    working-directory: terraform/environments/dev/resources

jobs:
  plan:
    name: Format, Validate, Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.55.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terragrunt hclfmt check
        run: terragrunt hclfmt --terragrunt-check
        continue-on-error: true

      - name: Terragrunt init
        run: terragrunt init -input=false --terragrunt-non-interactive

      - name: Terragrunt validate
        run: terragrunt validate --terragrunt-non-interactive

      - name: Terragrunt plan
        id: plan
        run: terragrunt plan -no-color -input=false --terragrunt-non-interactive
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terragrunt Plan
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terragrunt Apply (manual approval)
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production # configure this GitHub Environment with required reviewers
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.55.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terragrunt init
        run: terragrunt init -input=false --terragrunt-non-interactive

      - name: Terragrunt apply
        run: terragrunt apply -auto-approve -input=false --terragrunt-non-interactive
