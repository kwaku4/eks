apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo
  annotations:
    # NLB instead of the older Classic ELB; internet-facing so the app is
    # reachable per the assignment requirement.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-target-type: "ip"
spec:
  type: LoadBalancer
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
